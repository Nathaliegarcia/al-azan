name: build dev

on:
  release:
    types: [published]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2024.01.1-ndk
      options: --user root
    
    steps:
    - name: install git
      run: |
        sudo apt-get update;
        sudo apt-get -y install git;

    - name: Checkout repository
      uses: actions/checkout@v3
      with: 
        submodules: 'true'

    - name: Setup java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        build-root-directory: android

    - name: Setup node
      uses: actions/setup-node@v3
      with:
        node-version: 20
    
    - name: Install yarn
      run: npm install -g yarn
    
    - name: Install packages
      run: yarn install --frozen-lockfile  # install project deps with --frozen-lockfile to make sure we will have the same packages version ( very recommended  on running yarn install on ci)

    - name: patch notifee rn package
      run: |
        sed -E -i 's/^.*(fabric|com\.(crashlytics|google\.(firebase|android.gms))).*$//g' ./node_modules/@notifee/react-native/android/build.gradle

    - name: Compile lingui.js locales
      run: |
        sed "s/<TRANSLATION_IO_APIKEY>//" lingui.config.js.example > lingui.config.js;
        yarn lingui compile;

    - name: Make Gradlew Executable
      run: cd android && chmod +x ./gradlew

    - name: free disk space
      run: |
        yarn cache clean
        sudo apt clean
        df -h

    - name: build Apk files
      run: |
        cd android
        ./gradlew --no-daemon :app:assembleRelease -PnoSign -PuseLegacyPackaging=true -PenableSeparateBuildPerCPUArchitecture=false

    - name: Sign Apk files
      if: ${{ github.event_name == 'release' || github.event_name == 'pull_request' }}
      uses: r0adkll/sign-android-release@v1.0.4
      with:
        releaseDirectory: android/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
        alias: ${{ secrets.ANDROID_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      env:
        # build tools version is found inside cimg/android related tag pulled layers details inside docker hub. after `...-c SDK_TOOLS_URL=...`
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload signed APK as artifact
      if: ${{ github.event_name == 'release' || github.event_name == 'pull_request' }}
      id: upload-signed-apk
      uses: actions/upload-artifact@v4
      with:
        name: signed-apk
        path: android/app/build/outputs/apk/release/*signed.apk
        retention-days: 90

    - name: Add signed APK link to summary
      if: ${{ github.event_name == 'release' || github.event_name == 'pull_request' }}
      run: |
        echo "## 📦 Signed APK" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **[Download Signed APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-signed-apk.outputs.artifact-id }})**" >> $GITHUB_STEP_SUMMARY
